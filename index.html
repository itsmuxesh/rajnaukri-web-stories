
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>RajNaukri Web Stories - Latest Updates</title>
<meta name="description" content="Read the latest Government Jobs, Results, Education and Rajasthan News Web Stories on RajNaukri.">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fa;
 color:#222;
}
header{
 background:#fff;
 padding:18px 16px;
 border-bottom:1px solid #eee;
}
.container{
 max-width:1100px;
 margin:auto;
}
.logo{
 font-size:25px;
 font-weight:800;
 color:#1769aa;
}
.logo span{color:#222}
.tagline{
 font-size:13px;
 color:#777;
 margin-top:5px;
}
main{padding:25px 16px}
h1{font-size:25px;margin:0 0 8px}
.subtitle{color:#777;font-size:14px}
.stories{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
 gap:17px;
 margin-top:25px;
}
.story{
 display:block;
 text-decoration:none;
 color:#222;
 background:white;
 border-radius:12px;
 overflow:hidden;
 box-shadow:0 2px 12px #0000000b;
}
.story img{
 width:100%;
 aspect-ratio:9/16;
 object-fit:cover;
 display:block;
 background:#e7edf4;
}
.story h2{
 font-size:15px;
 line-height:1.5;
 padding:10px;
 margin:0;
}
.empty{
 background:white;
 padding:35px 15px;
 border-radius:12px;
 text-align:center;
 color:#777;
 margin-top:25px;
}
footer{
 text-align:center;
 padding:25px;
 color:#888;
 font-size:13px;
}
@media(max-width:400px){
 .stories{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<header>
 <div class="container">
  <div class="logo">Raj<span>Naukri</span></div>
  <div class="tagline">Latest Government Jobs & News Stories</div>
 </div>
</header>

<main class="container">
 <h1>Latest Web Stories</h1>
 <div class="subtitle">Latest Jobs, Results & Education Updates</div>

 <div class="stories" id="stories"></div>

 <div class="empty" id="empty">
  नई Stories जल्द यहां दिखाई देंगी।
 </div>
</main>

<footer>
 © 2026 RajNaukri. All Rights Reserved.
</footer>

<script>
const stories = [
 // New Story entries will be added here.
];

const container = document.getElementById("stories");
const empty = document.getElementById("empty");

stories.forEach(story => {
 const card = document.createElement("a");
 card.className = "story";
 card.href = story.url;

 const img = document.createElement("img");
 img.src = story.image;
 img.alt = story.title;
 img.loading = "lazy";

 const title = document.createElement("h2");
 title.textContent = story.title;

 card.append(img,title);
 container.appendChild(card);
});

if(stories.length > 0){
 empty.style.display = "none";
}
</script>
</body>
</html>
